<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghost Typer</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">👻</div>
      <h1>Ghost Typer</h1>
      <p class="subtitle">Types like a real human — undetectable</p>
    </header>

    <div class="input-group">
      <label for="codeInput">Paste Your Code</label>
      <textarea id="codeInput" placeholder="Paste your code here..." spellcheck="false"></textarea>
      <div class="char-count"><span id="charCount">0</span> characters</div>
    </div>

    <div class="divider"></div>

    <div class="settings-section">
      <div class="settings-header">
        <span class="settings-icon">⚙️</span>
        <span>Settings</span>
      </div>

      <div class="setting-row">
        <label for="wpmSlider">Typing Speed</label>
        <div class="slider-group">
          <input type="range" id="wpmSlider" min="15" max="120" value="40" step="5">
          <span id="wpmValue" class="slider-value">40 WPM</span>
        </div>
      </div>

      <div class="setting-row">
        <label for="errorSelect">Typo Frequency</label>
        <select id="errorSelect">
          <option value="none">No mistakes</option>
          <option value="rare">Rare (1 in 200 chars)</option>
          <option value="low" selected>Low (1 in 100 chars)</option>
          <option value="medium">Medium (1 in 50 chars)</option>
          <option value="high">High (1 in 25 chars)</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="pauseSelect">Thinking Pauses</label>
        <select id="pauseSelect">
          <option value="none">No pauses</option>
          <option value="light">Light</option>
          <option value="natural" selected>Natural</option>
          <option value="heavy">Heavy (beginner)</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="newlineSelect">Newline Delay</label>
        <select id="newlineSelect">
          <option value="short">Short</option>
          <option value="natural" selected>Natural</option>
          <option value="long">Long (reading next line)</option>
        </select>
      </div>

      <div class="toggle-row">
        <label for="burstToggle">Burst Typing</label>
        <div class="toggle-desc">Type faster for common words, slower for complex ones</div>
        <label class="switch">
          <input type="checkbox" id="burstToggle" checked>
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div class="toggle-row">
        <label for="warmupToggle">Warmup Effect</label>
        <div class="toggle-desc">Start slow and gradually speed up</div>
        <label class="switch">
          <input type="checkbox" id="warmupToggle" checked>
          <span class="slider-toggle"></span>
        </label>
      </div>
    </div>

    <div class="btn-group">
      <button id="startBtn" class="primary-btn">
        <span class="btn-icon">▶</span> Start Typing
      </button>
      <button id="stopBtn" class="stop-btn hidden">
        <span class="btn-icon">■</span> Stop
      </button>
    </div>

    <div id="statusMsg" class="status hidden"></div>

    <div class="footer">
      Press <kbd>Esc</kbd> on the page to emergency stop
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
